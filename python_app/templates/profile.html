{% extends "base.html" %}{% block title %}Business profile — Hiraya Marketing{% endblock %}{% block content %}<h1>Business profile</h1><p class="muted">Set this once so your audits, plans and recommendations can fit your business.</p><form method="post" class="card form-card stack"><div><label>Business name</label><input name="name" required value="{{ business.name if business else '' }}"></div><div><label>Industry</label><input name="industry" value="{{ business.industry if business else '' }}"></div><div><label>Location</label><input name="location" value="{{ business.location if business else '' }}"></div><div><label>Target audience</label><textarea name="audience">{{ business.audience if business else '' }}</textarea></div><div><label>Goals</label><textarea name="goals">{{ business.goals if business else '' }}</textarea></div><div><label>Monthly marketing budget (PHP)</label><input name="monthly_budget" type="number" min="0" value="{{ business.monthly_budget if business and business.monthly_budget else '' }}"></div><fieldset><legend>Platforms</legend><div class="checks">{% for p in platforms %}<label><input type="checkbox" name="platforms" value="{{ p }}" {% if business and p in (business.platforms or []) %}checked{% endif %}> {{ p }}</label>{% endfor %}</div></fieldset><button class="btn" type="submit">Save profile</button></form>{% endblock %}
