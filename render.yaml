services:
  - type: web
    name: hiraya-marketing-backend
    runtime: python
    rootDir: python_app
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        value: https://eszlrvwnaubkljmdxtss.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HIRAYA_MODEL
        value: gpt-5-mini
